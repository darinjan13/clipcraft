[project]
name = "clipcraft-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "cryptography==45.0.7",
  "httpx==0.28.1",
  "python-multipart==0.0.12",
  "pydantic==2.9.2",
  "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
